<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אזור מוגן · כניסה בקוד</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0f1419;--card:#1a212b;--card2:#222b38;--line:#2e3a4a;--txt:#e7edf3;--mut:#93a1b3;--accent:#3b82f6;--accent2:#1f4e78;--green:#22c55e;--greenbg:#16361f;--orange:#f59e0b;--orangebg:#3a2c10;--red:#ef4444;--redbg:#3a1717;--gold:#fbbf24}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;overflow-x:hidden}
  /* ---- lock screen ---- */
  #lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1c2735,#0f1419);z-index:50}
  .lockcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:38px 34px;max-width:360px;width:90%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .lockcard h1{font-size:20px;margin:0 0 4px}
  .lockcard p{color:var(--mut);font-size:13.5px;margin:0 0 20px}
  #code{width:100%;font-size:26px;letter-spacing:10px;text-align:center;padding:13px 0;border-radius:11px;border:1px solid var(--line);background:#0d1219;color:var(--txt);outline:none;font-family:monospace}
  #code:focus{border-color:var(--accent)}
  #unlock{margin-top:14px;width:100%;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  #unlock:hover{background:#2f6fe0}
  #err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
  /* ---- app ---- */
  #app{display:none;max-width:1280px;margin:0 auto;padding:18px 16px 60px}
  .hero{padding:2px 2px 0;margin-bottom:9px}
  .credit{font-size:11.5px;margin-bottom:5px}
  .credit a{color:var(--mut);text-decoration:none}
  .credit a:hover{color:var(--accent);text-decoration:underline}
  .hero h1{font-size:20px;margin:0 0 3px;font-weight:800}
  .hero .herosub{color:var(--mut);font-size:13px}
  .hero .herosub b{color:#e7edf3}
  .kpis{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
  .kpi{display:inline-flex;align-items:baseline;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
  .kpi b{font-size:14px;font-weight:700}
  .kpi span{color:var(--mut);font-size:12px}
  .kpi.hot{background:#0e3a24;border-color:#1f8f57}
  .kpi.hot b{color:#7ef0aa}.kpi.hot span{color:#bbf7d0}
  .tabs{position:sticky;top:0;z-index:6;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;margin:0;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
  .tab{flex:0 0 auto;white-space:nowrap;padding:11px 14px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;color:var(--mut);cursor:pointer;font-size:14px;margin-bottom:-1px}
  .tab:hover{color:var(--txt);background:rgba(255,255,255,.04)}
  .tab.on{color:#fff;font-weight:600;border-bottom-color:var(--accent)}
  .tabsel{display:none;width:100%;background:#0d1219;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;font-size:16px;margin:0;outline:none}
  .tabsel:focus{border-color:var(--accent)}
  #panels{padding-top:14px}
  .panel{display:none}
  .panel.on{display:block}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .toolbar input,.toolbar select{background:#0d1219;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 12px;font-size:14px;outline:none}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
  .toolbar .cnt{color:var(--mut);font-size:13px;margin-inline-start:auto}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
  th,td{padding:9px 11px;text-align:start;border-bottom:1px solid var(--line)}
  th{background:var(--accent2);color:#fff;position:sticky;top:44px;cursor:pointer;user-select:none;font-weight:600;z-index:1}
  th:hover{background:#27598a}
  th .arr{opacity:.5;font-size:11px}
  tbody tr:hover{background:#1f2937}
  td.num{font-variant-numeric:tabular-nums;text-align:start}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .g{background:var(--greenbg);color:#86efac}.o{background:var(--orangebg);color:#fcd34d}.r{background:var(--redbg);color:#fca5a5}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .ccard h3{margin:0 0 12px;font-size:15.5px;color:var(--gold)}
  .ccard table{font-size:12.5px;white-space:normal}
  .ccard th{position:static}
  .bl{list-style:none;padding:0;margin:0}
  .bl li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--card2);font-size:14px}
  .bl li:before{content:"▸ ";color:var(--accent)}
  .tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .tipcard{display:flex;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .tipcard .tipico{font-size:26px;line-height:1;flex:0 0 auto}
  .tipcard h4{margin:0 0 5px;font-size:14.5px;color:var(--gold)}
  .tipcard p{margin:0;color:#c6d2e0;font-size:13.5px;line-height:1.65}
  .note{color:var(--mut);font-size:12.5px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .note b{color:var(--txt)}
  /* ---- section title ---- */
  .secttl{color:var(--gold);margin:20px 0 12px;font-size:16px;font-weight:700}
  /* ---- simulator ---- */
  .sim{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;margin-bottom:6px}
  .simnote{color:#c6d2e0;font-size:13px;line-height:1.65;margin:0 0 13px}
  .simnote b{color:var(--txt)}
  .simbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .simbar label{font-size:14px;color:var(--mut);font-weight:600}
  .simbar select{flex:1;min-width:200px;background:#0d1219;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 12px;font-size:16px;outline:none}
  .simbar select:focus{border-color:var(--accent)}
  .betgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
  .bet{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}
  .bet.local{border-color:#1f8f57;background:linear-gradient(160deg,#13261c,var(--card))}
  .bethd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
  .betcity{font-weight:700;font-size:14.5px}
  .betlot{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .bdg{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600}
  .bdg.combat{background:#0e3a24;color:#7ef0aa}
  .bdg.local{background:#3a3410;color:#fcd34d}
  .betstats{display:flex;gap:6px;text-align:center}
  .betstats>div{flex:1;background:var(--card2);border-radius:9px;padding:8px 4px}
  .betstats b{display:block;font-size:16px;margin-bottom:2px;font-weight:700}
  .betstats .pill{font-size:14px;padding:1px 8px}
  .betstats span{color:var(--mut);font-size:10.5px;line-height:1.25;display:block}
  /* ---- "where it's most worthwhile" highlight grid ---- */
  .hlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;margin-bottom:4px}
  .hlcard{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .hlico{font-size:19px;line-height:1;flex:0 0 auto}
  .hltxt{min-width:0}
  .hlk{color:var(--mut);font-size:10.5px;font-weight:600;margin-bottom:1px}
  .hlbig{font-weight:700;font-size:13px;line-height:1.2;margin-bottom:1px}
  .hlsub{color:var(--mut);font-size:10.5px;line-height:1.35}
  footer{color:#54637a;font-size:12px;text-align:center;margin-top:30px}
  @media(max-width:640px){
    #app{padding:16px 12px 56px}
    body{font-size:14px}
    .tabs{display:none}
    .tabsel{display:block;position:sticky;top:0;z-index:6}
    .kpis{gap:6px}
    .kpi span{font-size:11.5px}
    .toolbar{gap:8px}
    .toolbar input,.toolbar select{font-size:16px}
    .toolbar input{min-width:0!important;flex:1 1 100%}
    .toolbar select{flex:1 1 auto}
    .secttl{font-size:15px;margin:16px 0 10px}
    .cards{grid-template-columns:1fr}
    .tips{grid-template-columns:1fr}
    .hlgrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px}
    .betgrid{grid-template-columns:1fr;gap:10px}
  }
</style>
</head>
<body>

<div id="lock">
  <div class="lockcard">
    <h1>אזור מוגן</h1>
    <p>הזינו קוד גישה כדי להמשיך.</p>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="12" aria-label="קוד גישה">
    <button id="unlock">כניסה</button>
    <div id="err"></div>
  </div>
</div>

<div id="app"></div>

<script>
const BLOB = JSON.parse(document.getElementById('blob').textContent);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = (s,r=document)=>r.querySelector(s);
const fmt = n => (n==null||n==='')?'':Number(n).toLocaleString('he-IL');
const compCls = c => c==null?'':(c>=200?'r':c>=80?'o':'g');
const pctCls = p => p==null?'':(p>=45?'g':p>=35?'g':p>=25?'o':'r');

async function decrypt(code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(BLOB.iv)}, key, b64d(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const codeEl = $('#code'), errEl = $('#err');
const LS_KEY = 'ac_v1';
$('#unlock').addEventListener('click', tryUnlock);
codeEl.addEventListener('keydown', e => { if(e.key==='Enter') tryUnlock(); });

async function boot(code){
  const dec = await decrypt(code);            // throws on a wrong code
  window.__D = dec.data;
  try{ localStorage.setItem(LS_KEY, code); }catch(e){}
  $('#lock').style.display='none';
  $('#app').style.display='block';
  (0,eval)(dec.code);
}

async function tryUnlock(){
  errEl.textContent='';
  const code = codeEl.value.trim();
  if(!code){ errEl.textContent='נא להזין קוד.'; return; }
  try{ await boot(code); }
  catch(e){ errEl.textContent='קוד שגוי. נסו שוב.'; codeEl.value=''; codeEl.focus(); }
}

// Remember a previous unlock — skip the code screen on return visits.
(async()=>{
  let saved=null; try{ saved=localStorage.getItem(LS_KEY); }catch(e){}
  if(saved){ try{ await boot(saved); return; }catch(e){ try{ localStorage.removeItem(LS_KEY); }catch(_){} } }
  codeEl.focus();
})();
</script>
