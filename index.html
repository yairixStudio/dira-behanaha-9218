<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דירה בהנחה — מאגר הגרלות</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0f1419;--card:#1a212b;--card2:#222b38;--line:#2e3a4a;--txt:#e7edf3;--mut:#93a1b3;--accent:#3b82f6;--accent2:#1f4e78;--green:#22c55e;--greenbg:#16361f;--orange:#f59e0b;--orangebg:#3a2c10;--red:#ef4444;--redbg:#3a1717;--gold:#fbbf24}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
  /* ---- lock screen ---- */
  #lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1c2735,#0f1419);z-index:50}
  .lockcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:38px 34px;max-width:380px;width:90%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .lockcard .ico{font-size:46px;margin-bottom:6px}
  .lockcard h1{font-size:21px;margin:6px 0 4px}
  .lockcard p{color:var(--mut);font-size:13.5px;margin:0 0 20px}
  #code{width:100%;font-size:26px;letter-spacing:10px;text-align:center;padding:13px 0;border-radius:11px;border:1px solid var(--line);background:#0d1219;color:var(--txt);outline:none;font-family:monospace}
  #code:focus{border-color:var(--accent)}
  #unlock{margin-top:14px;width:100%;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  #unlock:hover{background:#2f6fe0}
  #err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
  .lockfoot{color:#54637a;font-size:11.5px;margin-top:18px}
  /* ---- app ---- */
  #app{display:none;max-width:1280px;margin:0 auto;padding:18px 16px 60px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
  header.top h1{font-size:20px;margin:0;font-weight:700}
  header.top .sub{color:var(--mut);font-size:13px}
  header.top .asof{margin-inline-start:auto;background:var(--accent2);border:1px solid #2f6fe0;color:#dbeafe;border-radius:20px;padding:6px 14px;font-size:13.5px;white-space:nowrap}
  header.top .asof b{color:#fff}
  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 16px;min-width:120px;flex:1}
  .kpi b{display:block;font-size:22px}
  .kpi span{color:var(--mut);font-size:12px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tab{padding:8px 15px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-size:14px}
  .tab.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .panel{display:none}
  .panel.on{display:block}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .toolbar input,.toolbar select{background:#0d1219;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 12px;font-size:14px;outline:none}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
  .toolbar .cnt{color:var(--mut);font-size:13px;margin-inline-start:auto}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
  th,td{padding:9px 11px;text-align:start;border-bottom:1px solid var(--line)}
  th{background:var(--accent2);color:#fff;position:sticky;top:0;cursor:pointer;user-select:none;font-weight:600;z-index:1}
  th:hover{background:#27598a}
  th .arr{opacity:.5;font-size:11px}
  tbody tr:hover{background:#1f2937}
  td.num{font-variant-numeric:tabular-nums;text-align:start}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .g{background:var(--greenbg);color:#86efac}.o{background:var(--orangebg);color:#fcd34d}.r{background:var(--redbg);color:#fca5a5}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .ccard h3{margin:0 0 12px;font-size:15.5px;color:var(--gold)}
  .ccard table{font-size:12.5px}
  .ccard th{position:static}
  .bl{list-style:none;padding:0;margin:0}
  .bl li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--card2);font-size:14px}
  .bl li:before{content:"▸ ";color:var(--accent)}
  .note{color:var(--mut);font-size:12.5px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .note b{color:var(--txt)}
  footer{color:#54637a;font-size:12px;text-align:center;margin-top:30px}
  @media(max-width:640px){body{font-size:14px}.kpi b{font-size:18px}}
</style>
</head>
<body>

<div id="lock">
  <div class="lockcard">
    <div class="ico">🔒</div>
    <h1>מאגר דירה בהנחה</h1>
    <p>התוכן מוצפן. הזינו את קוד הגישה כדי לצפות בכל הנתונים.</p>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="12" aria-label="קוד גישה">
    <button id="unlock">פתיחה</button>
    <div id="err"></div>
    <div class="lockfoot">82 הגרלות · 19 ערים · נתונים מוצפנים בצד הלקוח (AES-256)</div>
  </div>
</div>

<div id="app"></div>

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(BLOB.iv)}, key, b64d(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const $ = (s,r=document)=>r.querySelector(s);
const fmt = n => (n==null||n==='')?'':Number(n).toLocaleString('he-IL');
const compCls = c => c==null?'':(c>=200?'r':c>=80?'o':'g');
const pctCls = p => p==null?'':(p>=45?'g':p>=35?'g':p>=25?'o':'r');

const codeEl = $('#code'), errEl = $('#err');
$('#unlock').addEventListener('click', tryUnlock);
codeEl.addEventListener('keydown', e => { if(e.key==='Enter') tryUnlock(); });
codeEl.focus();

async function tryUnlock(){
  errEl.textContent='';
  const code = codeEl.value.trim();
  if(!code){ errEl.textContent='נא להזין קוד.'; return; }
  try{
    const data = await decrypt(code);
    $('#lock').style.display='none';
    const app = $('#app'); app.style.display='block';
    render(app, data);
  }catch(e){
    errEl.textContent='קוד שגוי. נסו שוב.';
    codeEl.value=''; codeEl.focus();
  }
}

function render(app, D){
  const m = D.meta;
  app.innerHTML = `
    <header class="top">
      <h1>${m.title}</h1>
      <div class="sub">מקור: ${m.source} · הרשמה נסגרת ${m.closeDate}</div>
      <div class="asof">📅 הנתונים נכונים לתאריך <b>${m.pulled}</b></div>
    </header>
    <div class="kpis">
      <div class="kpi"><b>${fmt(m.totalLots)}</b><span>הגרלות פתוחות</span></div>
      <div class="kpi"><b>${fmt(m.cities)}</b><span>ערים</span></div>
      <div class="kpi"><b>${fmt(m.totalUnits)}</b><span>יחידות דיור</span></div>
      <div class="kpi"><b>${fmt(m.totalSubs)}</b><span>נרשמים</span></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
    <footer>נתונים נמשכו מאתר ההרשמה הרשמי. ניתוח שווי = הערכה, לא שמאות רשמית. אין כאן מידע אישי.</footer>`;

  const tabs = [
    ['concl','🏆 מסקנות'], ['all','כל ההגרלות'], ['city','סיכום לפי עיר'],
    ['odds','סיכויים הכי טובים'], ['value','ניתוח שווי'], ['notes','מקרא והערות'],
  ];
  const tabsEl = $('#tabs'), panelsEl = $('#panels');
  tabs.forEach(([id,label],i)=>{
    const t=document.createElement('div'); t.className='tab'+(i===0?' on':''); t.textContent=label; t.dataset.id=id;
    t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on')); $('#p-'+id).classList.add('on'); };
    tabsEl.appendChild(t);
    const p=document.createElement('div'); p.className='panel'+(i===0?' on':''); p.id='p-'+id; panelsEl.appendChild(p);
  });

  buildConcl($('#p-concl'), D);
  buildAll($('#p-all'), D.lotteries);
  buildCity($('#p-city'), D.byCity);
  buildOdds($('#p-odds'), D.lotteries);
  buildValue($('#p-value'), D.value);
  buildNotes($('#p-notes'), D);
}

/* ---------- generic sortable table ---------- */
function sortableTable(container, cols, rows, opts={}){
  let sortKey=opts.sortKey||null, asc=opts.asc!==false;
  const wrap=document.createElement('div'); wrap.className='tablewrap';
  const tbl=document.createElement('table');
  const thead=document.createElement('thead'); const tr=document.createElement('tr');
  cols.forEach(c=>{ const th=document.createElement('th'); th.innerHTML=c.label+' <span class="arr"></span>';
    th.onclick=()=>{ if(sortKey===c.key) asc=!asc; else {sortKey=c.key; asc=c.asc!==false;} draw(); };
    th.dataset.key=c.key; tr.appendChild(th); });
  thead.appendChild(tr); tbl.appendChild(thead);
  const tbody=document.createElement('tbody'); tbl.appendChild(tbody);
  wrap.appendChild(tbl); container.appendChild(wrap);
  function draw(){
    let r=rows.slice();
    if(sortKey){ r.sort((a,b)=>{ let x=a[sortKey],y=b[sortKey];
      if(x==null)return 1; if(y==null)return -1;
      if(typeof x==='number'&&typeof y==='number')return asc?x-y:y-x;
      return asc?String(x).localeCompare(String(y),'he'):String(y).localeCompare(String(x),'he'); }); }
    tbody.innerHTML='';
    r.forEach(row=>{ const t=document.createElement('tr');
      cols.forEach(c=>{ const td=document.createElement('td'); if(c.num)td.className='num';
        td.innerHTML=c.render?c.render(row[c.key],row):(row[c.key]==null?'':row[c.key]); t.appendChild(td); });
      tbody.appendChild(t); });
    tr.querySelectorAll('th').forEach(th=>{ const a=th.querySelector('.arr');
      a.textContent=th.dataset.key===sortKey?(asc?'▲':'▼'):''; });
  }
  draw();
  return {draw, setRows:nr=>{rows=nr; draw();}};
}

function buildAll(panel, lots){
  const bar=document.createElement('div'); bar.className='toolbar';
  bar.innerHTML='<input id="q-all" placeholder="חיפוש עיר / שכונה / קבלן..." style="min-width:240px"><select id="c-all"></select><span class="cnt" id="cnt-all"></span>';
  panel.appendChild(bar);
  const cities=[...new Set(lots.map(l=>l.city))].sort((a,b)=>a.localeCompare(b,'he'));
  $('#c-all',bar).innerHTML='<option value="">כל הערים</option>'+cities.map(c=>`<option>${c}</option>`).join('');
  const cols=[
    {key:'lot',label:'מס׳ הגרלה',num:true},
    {key:'city',label:'עיר'},
    {key:'hood',label:'שכונה'},
    {key:'process',label:'מסלול'},
    {key:'contractor',label:'קבלן'},
    {key:'unitsLottery',label:'יח״ד בהגרלה',num:true,render:v=>fmt(v)},
    {key:'price',label:'מחיר למ״ר ₪',num:true,render:v=>fmt(v)},
    {key:'subs',label:'נרשמים',num:true,render:v=>fmt(v)},
    {key:'comp',label:'יחס תחרות',num:true,asc:true,render:v=>v==null?'':`<span class="pill ${compCls(v)}">${v}</span>`},
    {key:'chance',label:'סיכוי %',num:true,render:v=>v==null?'':v+'%'},
    {key:'huCombat',label:'יח״ד ללוחמי מיל׳',num:true,render:v=>fmt(v)},
    {key:'huRes',label:'יח״ד למילואים',num:true,render:v=>fmt(v)},
    {key:'end',label:'סיום הרשמה'},
  ];
  const tbl=sortableTable(panel,cols,lots,{sortKey:'comp',asc:true});
  function apply(){ const q=$('#q-all',bar).value.trim().toLowerCase(); const c=$('#c-all',bar).value;
    const r=lots.filter(l=>(!c||l.city===c)&&(!q||(l.city+' '+l.hood+' '+l.contractor).toLowerCase().includes(q)));
    tbl.setRows(r); $('#cnt-all',bar).textContent=r.length+' הגרלות'; }
  $('#q-all',bar).oninput=apply; $('#c-all',bar).onchange=apply; apply();
}

function buildCity(panel, rows){
  const cols=[
    {key:'city',label:'עיר'},
    {key:'lots',label:'הגרלות',num:true},
    {key:'units',label:'סה״כ יח״ד',num:true,render:v=>fmt(v)},
    {key:'subs',label:'סה״כ נרשמים',num:true,render:v=>fmt(v)},
    {key:'comp',label:'יחס תחרות ממוצע',num:true,asc:true,render:v=>v==null?'':`<span class="pill ${compCls(v)}">${v}</span>`},
    {key:'pmin',label:'מחיר מינ׳ ₪/מ״ר',num:true,render:v=>fmt(v)},
    {key:'pmax',label:'מחיר מקס׳ ₪/מ״ר',num:true,render:v=>fmt(v)},
    {key:'pavg',label:'מחיר ממוצע ₪/מ״ר',num:true,render:v=>fmt(v)},
  ];
  sortableTable(panel,cols,rows,{sortKey:'comp',asc:true});
}

function buildOdds(panel, lots){
  const rows=lots.filter(l=>l.comp!=null).slice().sort((a,b)=>a.comp-b.comp).map((r,i)=>({rank:i+1,...r}));
  const cols=[
    {key:'rank',label:'דירוג',num:true},
    {key:'lot',label:'מס׳ הגרלה',num:true},
    {key:'city',label:'עיר'},
    {key:'hood',label:'שכונה'},
    {key:'unitsLottery',label:'יח״ד',num:true,render:v=>fmt(v)},
    {key:'subs',label:'נרשמים',num:true,render:v=>fmt(v)},
    {key:'comp',label:'יחס תחרות',num:true,asc:true,render:v=>`<span class="pill ${compCls(v)}">${v}</span>`},
    {key:'chance',label:'סיכוי %',num:true,render:v=>v==null?'':v+'%'},
    {key:'price',label:'מחיר ₪/מ״ר',num:true,render:v=>fmt(v)},
  ];
  const intro=document.createElement('p'); intro.className='note'; intro.style.marginBottom='12px';
  intro.innerHTML='<b>יחס תחרות = נרשמים ÷ יחידות דיור.</b> ככל שנמוך יותר, כך גדל הסיכוי לזכות. הטבלה ממוינת מהסיכוי הטוב ביותר.';
  panel.appendChild(intro);
  sortableTable(panel,cols,rows,{sortKey:'rank',asc:true});
}

function buildValue(panel, rows){
  const intro=document.createElement('p'); intro.className='note'; intro.style.marginBottom='12px';
  intro.innerHTML='<b>חיסכון %</b> = (מחיר שוק מוערך − מחיר מסובסד) ÷ מחיר שוק. מחיר השוק הוא <b>הערכה</b> לדירה דומה בשוק החופשי, לא שמאות רשמית. חיסכון לדירה מחושב לפי ~100 מ״ר.';
  panel.appendChild(intro);
  const cols=[
    {key:'lot',label:'מס׳ הגרלה',num:true},
    {key:'city',label:'עיר'},
    {key:'hood',label:'שכונה'},
    {key:'process',label:'מסלול'},
    {key:'sub',label:'מסובסד ₪/מ״ר',num:true,render:v=>fmt(v)},
    {key:'mkt',label:'שוק מוערך ₪/מ״ר',num:true,render:v=>fmt(v)},
    {key:'savePerM',label:'חיסכון ₪/מ״ר',num:true,render:v=>fmt(v)},
    {key:'savePct',label:'חיסכון %',num:true,render:v=>v==null?'':`<span class="pill ${pctCls(v)}">${v}%</span>`},
    {key:'saveAbs',label:'חיסכון לדירה ~100מ״ר ₪',num:true,render:v=>fmt(v)},
    {key:'comp',label:'יחס תחרות',num:true,asc:true,render:v=>v==null?'':`<span class="pill ${compCls(v)}">${v}</span>`},
  ];
  sortableTable(panel,cols,rows,{sortKey:'savePct',asc:false});
}

function buildConcl(panel, D){
  const c=D.conclusions;
  const bl=document.createElement('div');
  bl.innerHTML='<h3 style="color:var(--gold);margin:4px 0 12px;font-size:17px">🏆 איפה הכי כדאי — שורה תחתונה</h3>';
  const ul=document.createElement('ul'); ul.className='bl';
  c.bottomLine.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
  bl.appendChild(ul); panel.appendChild(bl);

  const grid=document.createElement('div'); grid.className='cards'; panel.appendChild(grid);
  const nm=r=>`${r.city}${r.hood?' / '+r.hood:''}`;
  function card(title, rows, cols){
    const d=document.createElement('div'); d.className='ccard';
    let h='<h3>'+title+'</h3><table><thead><tr>'+cols.map(c=>'<th>'+c.l+'</th>').join('')+'</tr></thead><tbody>';
    rows.forEach(r=>{ h+='<tr>'+cols.map(c=>'<td class="num">'+c.f(r)+'</td>').join('')+'</tr>'; });
    h+='</tbody></table>'; d.innerHTML=h; grid.appendChild(d);
  }
  card('הכי קל לזכות (תחרות נמוכה)', c.bestOdds, [
    {l:'עיר / שכונה',f:nm},{l:'הגרלה',f:r=>r.lot},
    {l:'תחרות',f:r=>`<span class="pill ${compCls(r.comp)}">${r.comp}</span>`},
    {l:'חיסכון %',f:r=>r.savePct==null?'':r.savePct+'%'}]);
  card('הכי משתלם באחוזים', c.bestPct, [
    {l:'עיר / שכונה',f:nm},{l:'הגרלה',f:r=>r.lot},
    {l:'חיסכון %',f:r=>`<span class="pill ${pctCls(r.savePct)}">${r.savePct}%</span>`},
    {l:'תחרות',f:r=>r.comp}]);
  card('הכי משתלם בש״ח (~100מ״ר)', c.bestAbs, [
    {l:'עיר / שכונה',f:nm},{l:'הגרלה',f:r=>r.lot},
    {l:'חיסכון ₪',f:r=>fmt(r.saveAbs)},{l:'חיסכון %',f:r=>r.savePct+'%'}]);
  card('כניסה בזול ביותר (₪/מ״ר)', c.cheapest, [
    {l:'עיר / שכונה',f:nm},{l:'הגרלה',f:r=>r.lot},
    {l:'מסובסד ₪/מ״ר',f:r=>fmt(r.sub)},{l:'חיסכון %',f:r=>r.savePct==null?'':r.savePct+'%'}]);
  card('⭐ נקודת המתיקות (סיכוי+שווי)', c.sweet, [
    {l:'עיר / שכונה',f:nm},{l:'הגרלה',f:r=>r.lot},
    {l:'תחרות',f:r=>`<span class="pill ${compCls(r.comp)}">${r.comp}</span>`},
    {l:'חיסכון %',f:r=>r.savePct+'%'}]);
}

function buildNotes(panel, D){
  panel.innerHTML=`<div class="note">
    <b>על הנתונים</b><br>
    נמשכו אוטומטית מאתר ההרשמה הרשמי (${D.meta.source}) בתאריך ${D.meta.pulled}, במצב "פתוח להרשמה".
    ${fmt(D.meta.totalLots)} הגרלות ב-${fmt(D.meta.cities)} ערים · ${fmt(D.meta.totalUnits)} יח״ד · ${fmt(D.meta.totalSubs)} נרשמים. הרשמה נסגרת ${D.meta.closeDate}.<br><br>
    <b>הסבר עמודות</b><br>
    • יחס תחרות = נרשמים ÷ יח״ד בהגרלה. נמוך יותר = סיכוי גבוה יותר.<br>
    • סיכוי זכייה % = יח״ד ÷ נרשמים × 100 (הערכה גסה, לפני חלוקה לקבוצות זכאות).<br>
    • יח״ד למילואים / לוחמי מילואים / בני מקום / נכים = מספר הדירות המוקצה (מקסימום) לכל קבוצת עדיפות.<br><br>
    <b>חשוב — נרשמי מילואים/לוחמים</b><br>
    אתר ההרשמה אינו חושף בשלב ההרשמה הפתוחה כמה מהנרשמים הם משרתי מילואים או לוחמים (השדות מוחזרים כ-0).
    מה שזמין ומדויק: מספר הדירות שמוקצה לכל קבוצה. הפילוח לפי קבוצות מתפרסם בדרך כלל רק לאחר עריכת ההגרלה.<br><br>
    <b>ניתוח שווי</b><br>
    • "מחיר מסובסד למ״ר" = המחיר באתר ההגרלה (מה שמשלם הזוכה).<br>
    • "מחיר שוק מוערך למ״ר" = הערכת מחיר לדירה חדשה/דומה באותה עיר בשוק החופשי. הערכה בלבד, מבוססת על נתוני שוק ופרסומים (ממוצע ארצי ~₪2.33 מ׳; אשדוד 4 חד׳ ~₪1.94 מ׳; חיסכון מדווח 20%-25%). אינה שמאות רשמית.<br>
    • במסלול "מחיר מופחת" ייתכן הנחה נוספת (עד 25% / ₪600 אלף) מעבר למחיר המוצג — החיסכון בפועל עשוי להיות גבוה אף יותר.<br><br>
    <b>צבעים</b><br>
    תחרות: <span class="pill g">ירוק &lt;80</span> <span class="pill o">כתום 80-200</span> <span class="pill r">אדום &gt;200</span> · חיסכון: ירוק גבוה, אדום נמוך.
  </div>`;
}
</script>
</body>
</html>
